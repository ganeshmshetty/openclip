name: OpenClip
options:
  bundleIdPrefix: com.openclip
targets:
  Core:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    sources: [Sources/Core]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
  OpenClip:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources: [Sources/OpenClip]
    info:
      path: Sources/OpenClip/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.openclip.url
            CFBundleURLSchemes:
              - openclip
        LSUIElement: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: true
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - target: Core
      - package: KeyboardShortcuts
      - package: SDWebImageSwiftUI
      - package: SDWebImageSVGCoder
  OpenClipTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources: [Tests/OpenClipTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - target: OpenClip
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  SDWebImageSwiftUI:
    url: https://github.com/SDWebImage/SDWebImageSwiftUI
    from: 3.0.0
  SDWebImageSVGCoder:
    url: https://github.com/SDWebImage/SDWebImageSVGCoder
    from: 1.7.0
