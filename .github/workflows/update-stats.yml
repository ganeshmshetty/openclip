name: Update Extension Stats

# Nightly job that reads GitHub Release download counts and writes them into
# extension-stats.json (committed to the repo), following the Obsidian model.
on:
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC nightly
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extensions-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect download counts
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ROOT="$(pwd)"
          TMP="$(mktemp)"

          # All releases, paginated. Each release tag is "<identifier>@<version>"
          # and carries the built <Name>.openclipext.zip as an asset.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate > "$TMP"
          jq -n --arg updatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             '{updatedAt: $updatedAt, downloads: {}}' > "$ROOT/extension-stats.json"

          jq -r '.[] | select(.tag_name | contains("@")) | .tag_name' "$TMP" \
            | sed 's/@.*//' | sort -u | while read -r identifier; do
              count=$(jq -r \
                --arg ident "$identifier" \
                '[.[] | select(.tag_name | startswith($ident + "@")) | .assets[] | select(.name | endswith(".openclipext.zip")) | .download_count] | add // 0' \
                "$TMP")
              jq --arg id "$identifier" --argjson c "$count" \
                '.downloads[$id] = $c' "$ROOT/extension-stats.json" > "$ROOT/extension-stats.json.tmp"
              mv "$ROOT/extension-stats.json.tmp" "$ROOT/extension-stats.json"
            done

      - name: Commit stats
        run: |
          git config user.name "OpenClip Bot"
          git config user.email "actions@github.com"
          git add extension-stats.json
          if git diff --cached --quiet; then
            echo "No download count changes; skipping commit."
          else
            git commit -m "chore(extensions): update download stats [skip ci]"
            git push origin main
          fi
