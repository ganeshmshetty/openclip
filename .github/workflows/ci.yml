name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Build & Unit Test
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Run Unit Tests
        run: ./scripts/test.sh --unit

      - name: Build App (Release)
        run: xcodebuild -project OpenClip.xcodeproj -scheme OpenClip -configuration Release -destination 'platform=macOS' build
